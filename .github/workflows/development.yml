name: Development CI

on:
  push:
    branches:
      - development

env:
  CI: true
  GITHUB_BRANCH: ${{ github.ref }}
  GITHUB_HEAD_REF: ${{ github.head_ref }}
  GITHUB_BASE_REF: ${{ github.base_ref }}
  GITHUB_COMMIT: ${{ github.sha }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.20', '1.21']

    steps:
      - uses: actions/checkout@v4
      - name: Set up Go ${{ matrix.go-version }} on ${{ matrix.os }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run Quality Formatting Checks
        run: go fmt ./...
      - name: Run Tests with Coverage Profile Configuration
        run: go test -v -coverprofile=coverage.out -covermode=atomic ./...
      - name: Convert Coverage Matrix into LCOV Data Formatting
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.21'
        run: |
          go install ://github.com
          $(go env GOPATH)/bin/gcov2lcov -infile=coverage.out -outfile=lcov.info
      - name: Code Coverage Tracking Reporting
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.21'
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./lcov.info
      - name: Publish Coverage Matrix Analysis Data out to Code Climate
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.21'
        uses: paambaati/codeclimate-action@v5.0.0
        env:
          CC_TEST_REPORTER_ID: ${{ secrets.CC_TEST_REPORTER_ID }}
        with:
          coverageCommand: go test -v ./...
          coverageLocations: |
            ./lcov.info:lcov
